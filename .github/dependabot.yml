# Weekly, one grouped PR per ecosystem. The prefixes make the PR titles
# conventional commits: `build(deps): …` is listed in the changelog, `ci(deps): …`
# is not. The starter template (template/) is left out: its Cargo.toml holds
# Liquid tags and depends on the SDK by tag.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]
    # Pinned exactly on purpose and moved together, as a breaking release
    # (Cargo.toml, crates/waybar_gpui/Cargo.toml, docs/guide/limits.md).
    ignore:
      - dependency-name: gpui-pre
      - dependency-name: gpui-pre-platform
      - dependency-name: gpui-component
      - dependency-name: gpui-kit-assets
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
