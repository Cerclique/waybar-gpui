# Weekly, one grouped PR per ecosystem. The prefixes make the PR titles
# conventional commits: `build(deps): …` is listed in the changelog, `ci(deps): …`
# is not. The starter template (template/) is left out: its manifest is a
# Liquid template (Cargo.toml.liquid), and its SDK version moves with the
# workspace's, as check-template.sh checks. A release waits a week before
# Dependabot proposes it: time for a broken or compromised one to be pulled.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]
    # Pinned exactly on purpose and moved together, as a breaking release
    # (Cargo.toml, crates/waybar_gpui/Cargo.toml, docs/guide/limits.md).
    ignore:
      - dependency-name: gpui-pre
      - dependency-name: gpui-pre-platform
      - dependency-name: gpui-component
      - dependency-name: gpui-kit-assets
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
