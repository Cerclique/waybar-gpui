name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creates the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The notes are the tag's section of CHANGELOG.md, as the release PR wrote
      # it (git-cliff after 0.1.0, by hand for 0.1.0), without its heading: the
      # release title already names the version. Re-rendering with
      # `git cliff --latest` would give nothing for v0.1.0, whose history isn't
      # conventional.
      - name: Extract the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          heading=$(grep -F -m1 "## [$version]" CHANGELOG.md || true)
          if ! [[ $heading =~ \ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::CHANGELOG.md has no dated '## [$version]' section: '$heading'"
            exit 1
          fi
          awk -v h="## [$version]" 'index($0, "## [") == 1 { p = index($0, h) == 1; next } p' \
            CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}

  # Publishes the SDK from the tagged commit with crates.io trusted publishing
  # (configured on crates.io for this repository and release.yml): a
  # short-lived token from GitHub OIDC, no stored secret. No build cache, so
  # nothing a PR run wrote reaches the published crate.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `cargo publish` builds the crate.
      - uses: ./.github/actions/gpui-system-packages
      # The toolchain and components rust-toolchain.toml declares.
      - name: Install the Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - run: rustc --version
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked -p waybar_gpui
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
