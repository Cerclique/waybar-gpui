name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gpui-pre's Wayland platform links against these. Found by making the
      # build pass on ubuntu-latest; recheck when bumping GPUI.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev
      # The version the project is tested with.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      # Also runs the doctests.
      - run: cargo test
      # Both sides of the `components` feature.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Relative links only: --offline skips the web.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path target --exclude-path .claude './**/*.md'
          fail: true
