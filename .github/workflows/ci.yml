name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to a commit, with the release in a comment; Dependabot
# bumps both. Checkouts don't keep the token in .git/config: no step pushes.
# Build jobs get 45 minutes: a cold cache builds all of GPUI.
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gpui-system-packages
      # The toolchain and components rust-toolchain.toml declares.
      - name: Install the Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo build --locked --all-targets
      # Also runs the doctests, with and without the `components` feature.
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      # Both sides of the `components` feature.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The declared minimum (`rust-version`) still builds.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gpui-system-packages
      # Read from Cargo.toml, where it is declared once (Dependabot leaves
      # it alone there). RUSTUP_TOOLCHAIN makes the later steps use it:
      # rust-toolchain.toml would win over `rustup default`.
      - id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets --all-features

  # Advisories, licenses, bans and sources (deny.toml), then unused
  # dependencies.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-machete
      # The workspace members only: the template's Cargo.toml holds Liquid
      # tags and doesn't parse.
      - run: cargo machete crates examples

  # The starter template: tag matches the workspace version, both variants
  # generate and pass clippy against this checkout.
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gpui-system-packages
      # The toolchain and components rust-toolchain.toml declares.
      - name: Install the Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: template
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-generate
      - run: ./scripts/check-template.sh

  # The SDK's public API against its latest release on crates.io. Not a
  # required check: a PR with an intended breaking change fails here until the
  # release PR bumps the version, which is the cue for a minor release (0.x).
  semver:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gpui-system-packages
      # The toolchain and components rust-toolchain.toml declares.
      - name: Install the Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update
      - run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: semver
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks --package waybar_gpui

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Relative links only: --offline skips the web.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path target --exclude-path .claude './**/*.md'
          fail: true

  # Spell check, with the settings in _typos.toml. Same version as the prek
  # hook in .pre-commit-config.yaml; bump them together.
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # The workflows and the local action: actionlint (syntax, expressions, and
  # shellcheck on `run:` scripts), then zizmor's security audit. Same versions
  # as the prek hooks in .pre-commit-config.yaml; bump them together.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not in install-action: the release binary, checked against its
      # published SHA-256.
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.31.1,shellcheck@0.11.0
      - run: actionlint
      # Also after an actionlint failure, to report both at once. The token
      # (read-only) enables the online audits: impostor commits,
      # known-vulnerable actions, ref confusion.
      - if: ${{ !cancelled() }}
        run: zizmor --no-progress --format plain .github
        env:
          GH_TOKEN: ${{ github.token }}
