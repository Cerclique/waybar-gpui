[workspace]
resolver = "3"
members = ["crates/hypr", "crates/waybar_gpui", "crates/example-panels"]
# The starter template is a cargo-generate template, not a crate.
exclude = ["template"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
# The minimum supported Rust version, checked by the `msrv` CI job. It is the
# oldest toolchain that builds the workspace: gpui-pre 0.3.9 calls
# `std::hint::cold_path`, stable since 1.95.
rust-version = "1.95"
# Authors depend on the SDK by git tag; nothing goes to crates.io (docs/guide/limits.md).
publish = false

[workspace.dependencies]
hypr = { path = "crates/hypr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI is pre-1.0 and breaks between snapshots: keep these pinned exactly
# (see docs/research/gpui-popup-windows.md).
gpui          = { package = "gpui-pre",          version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
