[workspace]
resolver = "3"
members = ["crates/waybar_gpui", "examples/example-panels", "docs/guide/snippets"]
# The starter template is a cargo-generate template, not a crate.
exclude = ["template"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"
# The minimum supported Rust version, checked by the `msrv` CI job. It is the
# oldest toolchain that builds the workspace: gpui-pre 0.3.11 calls
# `std::hint::cold_path`, stable since 1.95.
rust-version = "1.95"
repository = "https://github.com/Cerclique/waybar-gpui"
# Only `waybar_gpui` goes to crates.io; it overrides this.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI is pre-1.0 and breaks between snapshots: keep these pinned exactly
# (see docs/research/gpui-popup-windows.md).
gpui          = { package = "gpui-pre",          version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
