# Git hooks run by prek (https://github.com/j178/prek); see docs/CONTRIBUTING.md.
# Install once per clone: prek install
default_install_hook_types: [pre-commit, pre-push]
# Hooks run at pre-commit unless they set `stages`.
default_stages: [pre-commit]

repos:
  # prek's built-in, offline versions of the pre-commit-hooks checks.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a Markdown line break.
        args: [--markdown-linebreak-ext=md]
        # Its manifest also enables pre-push; once at commit time is enough.
        stages: [pre-commit]
      - id: end-of-file-fixer
        # Generated by git-cliff, which ends it with a blank line.
        exclude: ^CHANGELOG\.md$
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
        # A cargo-generate template: Liquid tags make it invalid TOML until
        # generated (make check-template builds both variants).
        exclude: ^template/Cargo\.toml$
      - id: check-merge-conflict

  # The workflows and the local action, as CI's `workflows` job checks them;
  # same versions, bump them together. Each runs only when its files change.
  # actionlint is built with Go, and runs shellcheck on `run:` scripts when
  # it is installed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # zizmor is installed from PyPI. Offline audits only, unless GH_TOKEN is
  # set.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        # Upstream also matches .pre-commit-config.yaml; CI audits .github/.
        files: ^\.github/(workflows/[^/]+|dependabot|actions/.+/action)\.ya?ml$

  # Spell check, as CI's `typos` job; same version, bump them together.
  # Installed from PyPI. It fixes an unambiguous typo in place.
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        # Upstream's args, plus the root config only: given a file, typos
        # also reads the nearest Cargo.toml, and the template's isn't TOML
        # until generated.
        args: [--write-changes, --force-exclude, --isolated, --config, _typos.toml]
        # Its manifest also enables pre-push; once at commit time is enough.
        stages: [pre-commit]

  # The Rust checks of `make lint` and CI. check-template and the link check
  # stay in CI: slow, and they need cargo-generate and lychee.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types_or: [rust, toml]
        pass_filenames: false
      # Both sides of the `components` feature.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false
      - id: cargo-clippy-all-features
        name: cargo clippy --all-features
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false
      - id: make-test
        name: make test
        entry: make test
        language: system
        stages: [pre-push]
        # Whatever the pushed commits touch.
        always_run: true
        pass_filenames: false
