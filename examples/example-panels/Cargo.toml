# Plays the author: a program built on waybar_gpui exactly as one in its own
# repository would be, except for the path dependency.
[package]
name = "example-panels"
description = "Example panels for waybar_gpui"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The `controls` panel, built with gpui-component widgets.
components = ["waybar_gpui/components"]

[dependencies]
# In an author's repository:
# waybar_gpui = "0.2.0"
waybar_gpui = { path = "../../crates/waybar_gpui" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The smoke tests (src/smoke_tests.rs) need GPUI's TestAppContext. The guide
# tells authors not to depend on `gpui` directly, because a second pin means a
# second, incompatible `gpui`. This one is safe: it is the SDK's own workspace
# pin, so cargo unifies it with waybar_gpui's into a single `gpui`.
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
