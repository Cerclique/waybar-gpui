# The Rust toolchain the project is tested with. Local builds (through rustup)
# and CI's rust, template, semver and publish jobs all use it; nothing else
# names the version. Dependabot proposes each new stable release (weekly, a
# week after it ships); bump it here. The minimum supported Rust is the
# separate `rust-version` in Cargo.toml.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
