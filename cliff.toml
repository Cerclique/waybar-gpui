# git-cliff configuration: generates the CHANGELOG.md sections of releases
# after v0.1.0 from conventional commits (squash-merged PR titles).
# https://git-cliff.org/docs/configuration
#
# Release vX.Y.Z (see docs/CONTRIBUTING.md, "Releases"):
#
#   git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md
#
# This adds one section on top and keeps the rest of the file as it is. Never
# regenerate the whole file (`git cliff -o CHANGELOG.md`): the 0.1.0 entry is
# written by hand, because the history up to v0.1.0 isn't conventional, and a
# full regeneration would drop it.
#
# Merge commits are not conventional and are dropped with a "parse error(s)"
# warning; that is expected.

[changelog]
# `--prepend` replaces this header at the top of CHANGELOG.md, so the file must
# start with it exactly.
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Entries after 0.1.0 are generated by [git-cliff](https://git-cliff.org) from
the commit history; 0.1.0 is written by hand.\n
"""
# Each heading links its own release, so a prepended section needs no footer.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}]\
    {% if previous and previous.version %}(<REPO>/compare/{{ previous.version }}...{{ version }})\
    {% else %}(<REPO>/releases/tag/{{ version }}){% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING:** {% endif %}\
          {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {{ commit.message | upper_first }} \
          ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
trim = true
postprocessors = [
    { pattern = "<REPO>", replace = "https://github.com/Cerclique/waybar_gpui_plugin_template" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Keep the types in sync with .github/workflows/pr-title.yml.
# The HTML comments only fix the section order; `striptags` drops them.
commit_parsers = [
    { message = "^chore\\(release\\)|^chore: release", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^build", group = "<!-- 5 -->Build" },
    { message = "^(ci|test|chore|style)", skip = true },
]
# Breaking changes are always listed, even when their type is skipped above.
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
