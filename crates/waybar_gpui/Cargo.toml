[package]
name = "waybar_gpui"
description = "Write a GPUI panel, get a Waybar popover on Hyprland"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# gpui-component widgets, themed from `Theme`. Costs ~110 crates and ~10 MB.
components = ["dep:gpui-component", "dep:gpui-kit-assets"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
async-channel = "2"
uuid = { version = "1", features = ["v5"] }
# Pinned with gpui-pre: all three move together, as a breaking release.
# Directly, not through the gpui-kit umbrella, which turns on X11.
gpui-component = { version = "=0.8.0", optional = true }
# Icon SVGs for gpui-component widgets (dropdown arrows, checkmarks…).
gpui-kit-assets = { version = "=0.8.0", optional = true }

[lints]
workspace = true
